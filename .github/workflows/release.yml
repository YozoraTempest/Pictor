name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Read and validate release metadata
        id: metadata
        run: node scripts/prepare-release.mjs
      - name: Reject an existing version tag
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set +e
          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Failed to query remote tags." >&2
            exit "$status"
          fi
          if [ -n "$remote_tag" ]; then
            echo "Release tag $RELEASE_TAG already exists. Bump the version before merging to main." >&2
            exit 1
          fi

  packages:
    name: Build desktop packages
    needs: metadata
    uses: ./.github/workflows/package-desktop.yml
    with:
      source_sha: ${{ github.sha }}
      version: ${{ needs.metadata.outputs.version }}
      artifact_prefix: release
      run_source_validation: true

  publish:
    name: Publish atomic desktop release
    needs:
      - metadata
      - packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*-x64
          path: release-assets
          merge-multiple: true
      - name: Read release notes
        id: metadata
        run: node scripts/prepare-release.mjs
      - name: Prepare checksums and release notes
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_NOTES_PATH: ${{ steps.metadata.outputs.notes_path }}
        run: |
          cd release-assets
          sha256sum \
            "Pictor-$RELEASE_VERSION-windows-x64-setup.exe" \
            "Pictor-$RELEASE_VERSION-arch-x64.pacman" \
            "Pictor-$RELEASE_VERSION-linux-x64.AppImage" > SHA256SUMS
          {
            echo
            echo '### SHA-256'
            while read -r digest asset; do
              echo "- \`$asset\`: \`$digest\`"
            done < SHA256SUMS
          } >> "$RELEASE_NOTES_PATH"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_NOTES_PATH: ${{ steps.metadata.outputs.notes_path }}
        run: |
          draft_created=0
          cleanup_draft() {
            if [ "$draft_created" -ne 1 ]; then
              return
            fi
            is_draft="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft 2>/dev/null || true)"
            if [ "$is_draft" != true ]; then
              return
            fi
            gh release delete "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag \
              --yes || true
          }
          trap cleanup_draft ERR
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Pictor $RELEASE_VERSION" \
            --notes-file "$RELEASE_NOTES_PATH" \
            --draft
          draft_created=1
          gh release upload "$RELEASE_TAG" \
            release-assets/Pictor-$RELEASE_VERSION-windows-x64-setup.exe \
            release-assets/Pictor-$RELEASE_VERSION-arch-x64.pacman \
            release-assets/Pictor-$RELEASE_VERSION-linux-x64.AppImage \
            release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
          trap - ERR
