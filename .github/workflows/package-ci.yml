name: Package CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - '.github/workflows/**'
      - 'electron.vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'packaging/**'
      - 'packages/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'src/application/**'
      - 'src/cli/**'
      - 'src/gui/**'
      - 'src/main/**'
      - 'src/node/**'
      - 'src/renderer/**'
      - 'src/runtime/**'
      - 'src/shared/**'
      - 'src/tui/**'
      - 'src/web-client/**'
      - 'src/web-host/**'
      - 'web.vite.config.ts'

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-package:
    name: Web package acceptance
    uses: ./.github/workflows/package-web.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      artifact_prefix: pr-${{ github.event.pull_request.number }}
      build_channel: ${{ github.base_ref == 'main' && (github.head_ref == 'develop' || startsWith(github.head_ref, 'hotfix/')) && 'stable' || 'development' }}
      run_source_validation: ${{ github.base_ref == 'main' && (github.head_ref == 'develop' || startsWith(github.head_ref, 'hotfix/')) }}

  desktop-packages:
    name: Desktop compatibility acceptance
    uses: ./.github/workflows/package-desktop.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      artifact_prefix: pr-${{ github.event.pull_request.number }}
      build_channel: ${{ github.base_ref == 'main' && (github.head_ref == 'develop' || startsWith(github.head_ref, 'hotfix/')) && 'stable' || 'development' }}
      run_source_validation: false
