name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild Nightly for the same green source commit
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  source:
    name: Resolve green develop snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      should_skip: ${{ steps.source.outputs.should_skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false
      - name: Verify develop CI and compare with the published Nightly
        id: source
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          source_version="$(node --print "require('./package.json').version")"
          ci_run="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=develop \
              -f event=push \
              -f head_sha="$source_sha" \
              -f per_page=1 \
              --jq '.workflow_runs[0] | [(.status // ""), (.conclusion // ""), (.html_url // "")] | join("|")'
          )"
          IFS='|' read -r ci_status ci_conclusion ci_url <<< "$ci_run"

          if [ "$ci_status" != 'completed' ] || [ "$ci_conclusion" != 'success' ]; then
            echo "::error::develop commit $source_sha does not have a successful CI push run (status=${ci_status:-missing}, conclusion=${ci_conclusion:-missing})."
            if [ -n "$ci_url" ]; then
              echo "CI run: $ci_url"
            fi
            exit 1
          fi
          echo "Verified successful develop CI: $ci_url"

          nightly_sha="$(
            git ls-remote origin 'refs/tags/nightly' 'refs/tags/nightly^{}' |
              awk '
                /\^\{\}$/ { peeled = $1 }
                !/\^\{\}$/ { direct = $1 }
                END { print peeled ? peeled : direct }
              '
          )"

          should_skip=false
          if [ "$FORCE_REBUILD" != 'true' ] && [ -n "$nightly_sha" ] && [ "$nightly_sha" = "$source_sha" ]; then
            should_skip=true
            echo "Nightly already points to $source_sha. Skipping the rebuild."
          else
            echo "Nightly will build develop commit $source_sha."
          fi

          {
            echo "sha=$source_sha"
            echo "version=$source_version"
            echo "should_skip=$should_skip"
          } >> "$GITHUB_OUTPUT"

  packages:
    name: Build desktop packages
    needs: source
    if: needs.source.outputs.should_skip != 'true'
    uses: ./.github/workflows/package-desktop.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}
      artifact_prefix: nightly
      build_channel: nightly
      run_source_validation: false
      run_e2e: true

  publish:
    name: Publish rolling Nightly
    needs:
      - source
      - packages
    if: ${{ success() && needs.source.outputs.should_skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: nightly-*-x64
          path: release-assets
          merge-multiple: true
      - name: Prepare checksums and Nightly notes
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          SOURCE_VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail

          cd release-assets
          sha256sum \
            "Pictor-$SOURCE_VERSION-windows-x64-setup.exe" \
            "Pictor-$SOURCE_VERSION-arch-x64.pacman" \
            "Pictor-$SOURCE_VERSION-linux-x64.AppImage" > SHA256SUMS

          source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SOURCE_SHA"
          built_at="$(date --utc '+%Y-%m-%d %H:%M:%S UTC')"
          {
            echo "This is an automated development build from the latest successful \`develop\` snapshot."
            echo
            printf -- "- Source commit: [\`%s\`](%s)\n" "$SOURCE_SHA" "$source_url"
            printf -- "- Built at: \`%s\`\n" "$built_at"
            echo
            echo '> Nightly packages are unsigned, may be unstable, and are not official releases. Back up important data before use.'
          } > "$RUNNER_TEMP/nightly-notes.md"
      - name: Remove the previous Nightly release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          elif git ls-remote --exit-code --tags origin refs/tags/nightly >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly"
          fi
      - name: Publish complete Nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          SOURCE_VERSION: ${{ needs.source.outputs.version }}
        run: |
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title 'Pictor Nightly' \
            --notes-file "$RUNNER_TEMP/nightly-notes.md" \
            --prerelease \
            --latest=false \
            "release-assets/Pictor-$SOURCE_VERSION-windows-x64-setup.exe" \
            "release-assets/Pictor-$SOURCE_VERSION-arch-x64.pacman" \
            "release-assets/Pictor-$SOURCE_VERSION-linux-x64.AppImage" \
            release-assets/SHA256SUMS
