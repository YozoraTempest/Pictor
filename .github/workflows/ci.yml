name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.2
  PNPM_VERSION: 11.24.0
  # The app pins the same package (harness-service.ts): a user installs it from
  # the settings page, and e2e needs one without asking the app to install it.
  DSH_PACKAGE: '@deepseek-ai/dsh@0.2.1-rc.2'

jobs:
  # Formatting, types, lint and the unit tests that pin pure logic. Nothing here
  # needs a display or a network, so it is the cheapest gate and runs first.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      # Typechecking does not prove the bundles build; this job does.
      - run: pnpm build:js

  # The specs drive the real application: main process, host core, renderer and
  # the agent runtime together. They need a display, so they run under Xvfb.
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      # Both halves: the renderer bundle the window loads, and the release
      # sidecar the app spawns.
      - run: pnpm build

      # A conversation needs the runtime, which the app would otherwise install
      # into a profile (about 900 MB). The cache is keyed by the pinned version,
      # so a bump reinstalls once and every later run restores in seconds.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pictor-dsh
          key: dsh-${{ runner.os }}-${{ env.DSH_PACKAGE }}

      - run: npm install --prefix "$HOME/.cache/pictor-dsh" "$DSH_PACKAGE" --no-audit --no-fund

      - name: Run the specs
        env:
          # e2e installs nothing and skips what it cannot run, so the runtime is
          # handed over and a skip is promoted to a failure.
          PICTOR_E2E_STRICT: '1'
          PICTOR_E2E_ELECTRON_ARGS: --no-sandbox
        run: |
          set -eu
          export PICTOR_DSH_BIN="$HOME/.cache/pictor-dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"
          export PICTOR_NODE_BIN="$(command -v node)"
          xvfb-run -a pnpm test:e2e

  # Packaging breaks in ways no unit test sees: a sidecar that never enters the
  # bundle, a binary with the wrong name, an Electron version that does not match.
  package:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - run: pnpm pack:dir

      - name: The bundle carries what the app spawns
        run: |
          set -eu
          test -x dist/linux-unpacked/pictor
          test -x dist/linux-unpacked/resources/host-core/pictor-host-core

      # The packaged app resolves the sidecar from `resourcesPath`, a path the
      # development tree never takes, so it has to be started once.
      - name: The packaged app starts
        run: |
          set -eu
          export PICTOR_USER_DATA="$(mktemp -d)"
          PICTOR_SMOKE=1 timeout 120 xvfb-run -a \
            dist/linux-unpacked/pictor --no-sandbox --disable-gpu > smoke.log 2>&1
          cat smoke.log
          grep -q 'pictor host core' smoke.log
          grep -q '\[smoke\] window loaded' smoke.log
