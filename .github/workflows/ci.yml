name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app_changed: ${{ steps.classify.outputs.app_changed }}
      workflow_changed: ${{ steps.classify.outputs.workflow_changed }}
      release_pr: ${{ steps.classify.outputs.release_pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths and pull request kind
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          mapfile -t changed_paths < <(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")
          if [ "${#changed_paths[@]}" -eq 0 ]; then
            echo 'Unable to classify a change with no changed paths.' >&2
            exit 1
          fi

          app_changed=false
          workflow_changed=false
          for path in "${changed_paths[@]}"; do
            case "$path" in
              .github/workflows/*.yml) workflow_changed=true ;;
              *.md | docs/* | .github/ISSUE_TEMPLATE/* | .github/PULL_REQUEST_TEMPLATE*) ;;
              *) app_changed=true ;;
            esac
          done

          release_pr=false
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ] && [ "$BASE_BRANCH" = 'main' ]; then
            if [ "$PR_HEAD" = 'develop' ] || [[ "$PR_HEAD" == hotfix/* ]]; then
              release_pr=true
            elif [[ "$PR_HEAD" == ci/* ]]; then
              invalid_paths=''
              for path in "${changed_paths[@]}"; do
                case "$path" in
                  .github/workflows/*.yml | README.md | CONTRIBUTING.md | docs/PROJECT_MANAGEMENT.md | docs/TESTING.md) ;;
                  *) invalid_paths+="$path"$'\n' ;;
                esac
              done
              if [ -n "$invalid_paths" ]; then
                echo 'Non-release ci/* pull requests to main contain disallowed paths:' >&2
                printf '%s' "$invalid_paths" >&2
                exit 1
              fi
            else
              echo 'Pull requests to main must come from develop, hotfix/*, or a path-restricted ci/* branch.' >&2
              exit 1
            fi
          fi

          printf 'Changed paths:\n'
          printf '  %s\n' "${changed_paths[@]}"
          {
            echo "app_changed=$app_changed"
            echo "workflow_changed=$workflow_changed"
            echo "release_pr=$release_pr"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Quality
    needs: changes
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: |
          echo 'Change classification failed; refusing to bypass Quality.' >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm without replacing the runner copy
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pictor-npm" npm@11.17.0
          echo "$RUNNER_TEMP/pictor-npm/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Validate changed workflows
        if: needs.changes.outputs.workflow_changed == 'true'
        env:
          ACTIONLINT_VERSION: 1.7.12
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          checksums="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          install_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$install_dir"
          gh release download "v$ACTIONLINT_VERSION" \
            --repo rhysd/actionlint \
            --pattern "$archive" \
            --pattern "$checksums" \
            --dir "$install_dir"
          grep " $archive\$" "$install_dir/$checksums" |
            (cd "$install_dir" && sha256sum --check)
          tar --extract --gzip --file "$install_dir/$archive" --directory "$install_dir"
          "$install_dir/actionlint" .github/workflows/*.yml
      - name: Validate release metadata
        if: needs.changes.outputs.release_pr == 'true'
        id: release-metadata
        run: node scripts/prepare-release.mjs
      - name: Validate release version is unused
        if: needs.changes.outputs.release_pr == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release-metadata.outputs.tag }}
        run: |
          $remoteTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to query remote tags"
          }
          if ($remoteTag) {
            throw "Release tag $env:RELEASE_TAG already exists. Bump the version before merging to main."
          }
      - run: npm run check:format
      - run: npm run check:types
        if: needs.changes.outputs.app_changed == 'true'
      - run: npm run check:lint
        if: needs.changes.outputs.app_changed == 'true'

  tests:
    name: Unit and integration
    needs: changes
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: |
          echo 'Change classification failed; refusing to bypass Unit and integration.' >&2
          exit 1
      - uses: actions/checkout@v7
        if: needs.changes.outputs.app_changed == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.app_changed == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm without replacing the runner copy
        if: needs.changes.outputs.app_changed == 'true'
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pictor-npm" npm@11.17.0
          echo "$RUNNER_TEMP/pictor-npm/bin" >> "$GITHUB_PATH"
      - run: npm ci
        if: needs.changes.outputs.app_changed == 'true'
      - run: npm test
        if: needs.changes.outputs.app_changed == 'true'

  windows-acceptance:
    name: Windows acceptance
    needs: changes
    if: always()
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'Change classification failed; refusing to bypass Windows acceptance.'
      - uses: actions/checkout@v7
        if: needs.changes.outputs.app_changed == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.app_changed == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm without replacing the runner copy
        if: needs.changes.outputs.app_changed == 'true'
        shell: pwsh
        run: |
          $npmPrefix = Join-Path $env:RUNNER_TEMP 'pictor-npm'
          npm install --global --prefix $npmPrefix npm@11.17.0
          $npmPrefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
        if: needs.changes.outputs.app_changed == 'true'
      - run: npm run deps:prepare
        if: needs.changes.outputs.app_changed == 'true'
      - run: npm run deps:verify
        if: needs.changes.outputs.app_changed == 'true'
      - run: npm run build:app
        if: needs.changes.outputs.app_changed == 'true'
      - name: Run Windows desktop shell smoke
        if: needs.changes.outputs.app_changed == 'true'
        run: npm run test:e2e:run -- e2e/shell.spec.ts
      - name: Upload failure evidence
        if: ${{ failure() && needs.changes.outputs.app_changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-playwright-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  linux-acceptance:
    name: Linux acceptance
    needs: changes
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: |
          echo 'Change classification failed; refusing to bypass Linux acceptance.' >&2
          exit 1
      - uses: actions/checkout@v7
        if: needs.changes.outputs.app_changed == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.app_changed == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm without replacing the runner copy
        if: needs.changes.outputs.app_changed == 'true'
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pictor-npm" npm@11.17.0
          echo "$RUNNER_TEMP/pictor-npm/bin" >> "$GITHUB_PATH"
      - run: npm --version
        if: needs.changes.outputs.app_changed == 'true'
      - run: npm ci
        if: needs.changes.outputs.app_changed == 'true'
      - run: npm run deps:prepare
        if: needs.changes.outputs.app_changed == 'true'
        env:
          ELECTRON_GET_USE_PROXY: 'true'
      - run: npm run deps:verify
        if: needs.changes.outputs.app_changed == 'true'
      - run: npm run build:app
        if: needs.changes.outputs.app_changed == 'true'
      - name: Run pull-request smoke tests
        if: ${{ needs.changes.outputs.app_changed == 'true' && github.event_name == 'pull_request' }}
        run: xvfb-run --auto-servernum npm run test:e2e:smoke:run
      - name: Run full desktop tests
        if: ${{ needs.changes.outputs.app_changed == 'true' && github.event_name == 'push' }}
        run: xvfb-run --auto-servernum npm run test:e2e:run
      - name: Upload failure evidence
        if: ${{ failure() && needs.changes.outputs.app_changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-playwright-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
