name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm without replacing the runner copy
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pictor-npm" npm@11.17.0
          echo "$RUNNER_TEMP/pictor-npm/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Validate workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          checksums="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          install_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$install_dir"
          gh release download "v$ACTIONLINT_VERSION" \
            --repo rhysd/actionlint \
            --pattern "$archive" \
            --pattern "$checksums" \
            --dir "$install_dir"
          grep " $archive\$" "$install_dir/$checksums" |
            (cd "$install_dir" && sha256sum --check)
          tar --extract --gzip --file "$install_dir/$archive" --directory "$install_dir"
          "$install_dir/actionlint" .github/workflows/*.yml
      - name: Validate pull requests to main
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        env:
          PR_HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "$PR_HEAD" in
            develop|hotfix/*)
              node scripts/prepare-release.mjs
              ;;
            ci/*)
              invalid_paths="$(
                git diff --name-only --no-renames '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}' |
                  grep -Ev '^(\.github/workflows/.*\.yml|README\.md|CONTRIBUTING\.md|docs/(PROJECT_MANAGEMENT|TESTING)\.md)$' || true
              )"
              if [ -n "$invalid_paths" ]; then
                printf 'Non-release ci/* pull requests to main contain disallowed paths:\n%s\n' "$invalid_paths" >&2
                exit 1
              fi
              ;;
            *)
              echo 'Pull requests to main must come from develop, hotfix/*, or a path-restricted ci/* branch.' >&2
              exit 1
              ;;
          esac
      - name: Validate release version is unused
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && (github.head_ref == 'develop' || startsWith(github.head_ref, 'hotfix/')) }}
        shell: pwsh
        run: |
          $tag = "v$((Get-Content package.json | ConvertFrom-Json).version)"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to query remote tags"
          }
          if ($remoteTag) {
            throw "Release tag $tag already exists. Bump the version before merging to main."
          }
      - run: npm run check:format
      - run: npm run check:types
      - run: npm run check:lint

  tests:
    name: Unit and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm without replacing the runner copy
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pictor-npm" npm@11.17.0
          echo "$RUNNER_TEMP/pictor-npm/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Test Pictor Core
        run: npm run test:core
      - name: Test Bundled Plugins
        run: npm run test:plugins
      - name: Test Plugin SDK
        run: npm run test:sdk

  windows-acceptance:
    name: Windows acceptance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm without replacing the runner copy
        shell: pwsh
        run: |
          $npmPrefix = Join-Path $env:RUNNER_TEMP 'pictor-npm'
          npm install --global --prefix $npmPrefix npm@11.17.0
          $npmPrefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
      - run: npm run deps:prepare
      - run: npm run deps:verify
      - run: npm run build:app

  linux-acceptance:
    name: Linux acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm without replacing the runner copy
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pictor-npm" npm@11.17.0
          echo "$RUNNER_TEMP/pictor-npm/bin" >> "$GITHUB_PATH"
      - run: npm --version
      - run: npm ci
      - run: npm run deps:prepare
        env:
          ELECTRON_GET_USE_PROXY: 'true'
      - run: npm run deps:verify
      - run: npm run build:app
