name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm without replacing the runner copy
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pictor-npm" npm@11.17.0
          echo "$RUNNER_TEMP/pictor-npm/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Classify pull request to main
        if: github.base_ref == 'main'
        id: main_pr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [ "$PR_HEAD" = 'develop' ] || [[ "$PR_HEAD" == hotfix/* ]]; then
            echo 'is_release=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$PR_HEAD" != ci/* ]]; then
            echo 'Pull requests to main must come from develop, hotfix/*, or a path-restricted ci/* branch.' >&2
            exit 1
          fi

          invalid_paths=''
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/*.yml | README.md | CONTRIBUTING.md | docs/PROJECT_MANAGEMENT.md | docs/TESTING.md) ;;
              *) invalid_paths+="$path"$'\n' ;;
            esac
          done < <(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")

          if [ -n "$invalid_paths" ]; then
            echo 'Non-release ci/* pull requests to main contain disallowed paths:' >&2
            printf '%s' "$invalid_paths" >&2
            exit 1
          fi

          echo 'is_release=false' >> "$GITHUB_OUTPUT"
      - name: Validate release metadata
        if: github.base_ref == 'main' && steps.main_pr.outputs.is_release == 'true'
        id: release-metadata
        run: node scripts/prepare-release.mjs
      - name: Validate release version is unused
        if: github.base_ref == 'main' && steps.main_pr.outputs.is_release == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release-metadata.outputs.tag }}
        run: |
          $remoteTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to query remote tags"
          }
          if ($remoteTag) {
            throw "Release tag $env:RELEASE_TAG already exists. Bump the version before merging to main."
          }
      - run: npm run check:format
      - run: npm run check:types
      - run: npm run check:lint

  tests:
    name: Unit and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm without replacing the runner copy
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pictor-npm" npm@11.17.0
          echo "$RUNNER_TEMP/pictor-npm/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm test

  windows-acceptance:
    name: Windows acceptance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm without replacing the runner copy
        shell: pwsh
        run: |
          $npmPrefix = Join-Path $env:RUNNER_TEMP 'pictor-npm'
          npm install --global --prefix $npmPrefix npm@11.17.0
          $npmPrefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
      - run: npm run deps:prepare
      - run: npm run deps:verify
      - run: npm run build:app

  linux-acceptance:
    name: Linux acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux packaging dependency
        if: github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libarchive-tools
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm without replacing the runner copy
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pictor-npm" npm@11.17.0
          echo "$RUNNER_TEMP/pictor-npm/bin" >> "$GITHUB_PATH"
      - run: npm --version
      - run: npm ci
      - run: npm run deps:prepare
        env:
          ELECTRON_GET_USE_PROXY: 'true'
      - run: npm run deps:verify
      - run: npm run build:app
      - name: Run pull-request smoke tests
        if: github.event_name == 'pull_request'
        run: xvfb-run --auto-servernum npm run test:e2e:smoke:run
      - name: Run full desktop tests
        if: github.event_name == 'push'
        run: xvfb-run --auto-servernum npm run test:e2e:run
      - run: npm run package:linux:build
        if: github.event_name == 'push'
      - run: npm run package:verify:linux
        if: github.event_name == 'push'
      - name: Verify portable AppImage launch
        if: github.event_name == 'push'
        run: |
          release_version="$(node --print "require('./package.json').version")"
          lifecycle_root="$(mktemp -d)"
          user_data="$lifecycle_root/pictor"
          chmod +x "./dist/Pictor-$release_version-linux-x64.AppImage"
          PICTOR_LINUX_EXECUTABLE="./dist/Pictor-$release_version-linux-x64.AppImage" \
            PICTOR_EXPECTED_DISTRIBUTION=unsupported-linux \
            PICTOR_USER_DATA_DIR="$user_data" \
            PICTOR_SCREENSHOT_PATH="$GITHUB_WORKSPACE/test-results/linux-package-launch.png" \
            xvfb-run --auto-servernum npm run package:verify:linux:launch
      - name: Verify Arch package lifecycle in a native container
        if: github.event_name == 'push'
        run: bash scripts/verify-arch-package-lifecycle.sh
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-playwright-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
