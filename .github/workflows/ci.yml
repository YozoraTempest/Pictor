name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Validate release branch
        if: github.base_ref == 'main'
        shell: pwsh
        env:
          RELEASE_HEAD: ${{ github.head_ref }}
        run: |
          if ($env:RELEASE_HEAD -ne 'develop' -and -not $env:RELEASE_HEAD.StartsWith('hotfix/')) {
            throw "Pull requests to main must come from develop or hotfix/*"
          }
      - name: Validate release metadata
        if: github.base_ref == 'main'
        id: release-metadata
        run: node scripts/prepare-release.mjs
      - name: Validate release version is unused
        if: github.base_ref == 'main'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release-metadata.outputs.tag }}
        run: |
          $remoteTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to query remote tags"
          }
          if ($remoteTag) {
            throw "Release tag $env:RELEASE_TAG already exists. Bump the version before merging to main."
          }
      - run: npm run check:format
      - run: npm run check:types
      - run: npm run check:lint

  tests:
    name: Unit and integration
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm test

  windows-acceptance:
    name: Windows acceptance
    needs:
      - quality
      - tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run deps:prepare
      - run: npm run deps:verify
      - run: npm run build:app
      - name: Run pull-request smoke tests
        if: github.event_name == 'pull_request'
        run: npm run test:e2e:smoke:run
      - name: Run full desktop tests
        if: github.event_name == 'push'
        run: npm run test:e2e:run
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
