name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run check:format
      - run: npm run check:types
      - run: npm run check:lint

  tests:
    name: Unit and integration
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm test

  windows-acceptance:
    name: Windows acceptance
    needs:
      - quality
      - tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run deps:prepare
      - run: npm run deps:verify
      - run: npm run build:app
      - name: Run pull-request smoke tests
        if: github.event_name == 'pull_request'
        run: npm run test:e2e:smoke:run
      - name: Run full desktop tests
        if: github.event_name == 'push'
        run: npm run test:e2e:run
      - name: Build Windows installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run package:build
      - name: Verify Windows package
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run package:verify
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: pictor-windows-${{ github.ref_name }}
          path: |
            dist/Pictor-*-windows-x64-setup.exe
            dist/win-unpacked/
          if-no-files-found: error
          retention-days: 14
