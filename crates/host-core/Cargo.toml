[package]
name = "pictor-host-core"
description = "Pictor host core: SQLite metadata store and JSON-RPC sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pictor-host-core"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
